name: installers

on:
  push:
  pull_request:
  release:

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install NSIS
      run: |
        choco install nsis -y
        Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\NSIS"
    - name: pip install
      run: |
        pip install .[gui]
        pip install pyinstaller wheel setuptools build
    - name: pyinstaller
      run: pyinstaller --noconfirm reynard-the-robot.spec
    - name: build wheel
      run: python -m build
    - name: Build Installer
      working-directory: ./packaging/nsis
      run: makensis setup.nsi
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: windows-files
        path: |
          ./dist/*.whl
          ./packaging/nsis/*.exe
